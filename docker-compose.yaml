services:
  vm:
    image: wa-avd:api36

    build:
      context: ./
      dockerfile: Dockerfile

    environment:
      # The desktop image uses USER as the HTTP username. All credentials are
      # required so the service cannot silently start with upstream defaults.
      USER: ${DESKTOP_USER:?Run configure.sh or configure.ps1 first}
      PASSWORD: ${DESKTOP_PASSWORD:?Run configure.sh or configure.ps1 first}
      HTTP_PASSWORD: ${HTTP_PASSWORD:?Run configure.sh or configure.ps1 first}
      VNC_PASSWORD: ${VNC_PASSWORD:?Run configure.sh or configure.ps1 first}
      # Dynamic browser-driven resizing recreates Xvfb. That disconnects the
      # emulator's Qt window and can terminate it with SIGSEGV (exit 139).
      RESOLUTION: 1600x900
      AVD_NAME: Pixel6_API36
      AVD_DEVICE: pixel_6
      ANDROID_SYSTEM_IMAGE: system-images;android-36;google_apis_playstore;x86_64
      AVD_CPU_CORES: ${AVD_CPU_CORES:-}
      AVD_RAM_MB: ${AVD_RAM_MB:-}

    ports:
      - "127.0.0.1:6080:80"

    devices:
      - /dev/kvm:/dev/kvm

    volumes:
      - android_api36:/root/.android

    shm_size: "2gb"
    restart: unless-stopped
    stop_grace_period: 2m

    security_opt:
      - no-new-privileges:true

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  android_api36:
